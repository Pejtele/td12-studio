[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td12-studio"
version = "0.2.0"
description = "Screen-independent trigger editor for the Roland TD-12"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.scripts]
td12-studio = "td12_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["td12_studio*"]

[tool.setuptools.package-data]
td12_studio = ["trig_types.json"]
