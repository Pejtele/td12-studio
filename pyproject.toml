[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td12-studio"
version = "0.1.0"
description = "Read-only TD-12 MIDI research tools toward a screen-independent editor"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.scripts]
td12-studio = "td12_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["td12_studio*"]
